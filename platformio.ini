; Gamma — ESP32-S3 firmware, step 1: AP + web dashboard + LED control
[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; required by ESP32Async libs
lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7

; packs web/ into include/web_assets.h before every build
extra_scripts = pre:scripts/embed_web.py

build_flags =
    -Wno-missing-field-initializers
    ; Uncomment if you watch the serial monitor through the board's native USB port:
    ; -DARDUINO_USB_CDC_ON_BOOT=1
